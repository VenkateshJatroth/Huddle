name: Deploy Huddle Landing Page to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "landing-page/**"
      - ".github/workflows/deploy-landing.yml"
      - "CNAME"
      - "index.html"
      - ".nojekyll"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Landing Page & CNAME
        run: |
          # Ensure CNAME exists in the deployment root
          printf "joinhuddle.me\n" > ./landing-page/CNAME
          touch ./landing-page/.nojekyll
          # Support both root domain (joinhuddle.me) and repository subfolder (/Huddle/)
          mkdir -p ./landing-page/Huddle
          cp -r ./landing-page/index.html ./landing-page/assets ./landing-page/Huddle/

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enable_jekyll: false

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./landing-page"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
